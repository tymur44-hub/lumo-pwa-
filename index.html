<script>
/* Временная тема Vice Nights: вступление показываем сразу при запуске, вместо обычной заставки (без двойной анимации) */
window.LUMO_VICE_INDEX=1;
(function(){
  try{
    var c=JSON.parse(localStorage.getItem('vice_av')||'null');
    if(!c||!c.on||(c.until&&new Date(c.until)<=new Date())||localStorage.getItem('vice_off')==='1') return;
  }catch(e){ return; }
  document.documentElement.classList.add('vice');
  var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content','#2a0f52');
  var u=function(s){ return 'url("data:image/svg+xml;utf8,'+encodeURIComponent(s)+'")'; };
  var SKY=u("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 390 260' preserveAspectRatio='xMidYMax slice'><defs><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#2a0f52'/><stop offset='.35' stop-color='#6d2483'/><stop offset='.62' stop-color='#ff4f8b'/><stop offset='.84' stop-color='#ff9a3d'/><stop offset='1' stop-color='#ffd36b'/></linearGradient><linearGradient id='u' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#ffe58a'/><stop offset='1' stop-color='#ff8a3d'/></linearGradient><clipPath id='c'><circle cx='195' cy='238' r='62'/></clipPath></defs><rect width='390' height='260' fill='url(#s)'/><g fill='#fff'><circle cx='40' cy='30' r='1.2'/><circle cx='120' cy='18' r='1'/><circle cx='260' cy='26' r='1.3'/><circle cx='340' cy='44' r='1'/><circle cx='300' cy='12' r='.9'/><circle cx='70' cy='60' r='.9'/></g><g clip-path='url(#c)'><rect x='130' y='176' width='130' height='90' fill='url(#u)'/><g fill='#ff4f8b' opacity='.9'><rect x='130' y='222' width='130' height='3'/><rect x='130' y='232' width='130' height='4'/><rect x='130' y='243' width='130' height='5'/><rect x='130' y='254' width='130' height='6'/></g></g><path fill='#1a0b33' d='M0 260 L0 236 L26 236 L26 222 L44 222 L44 232 L62 232 L62 204 L78 204 L78 232 L110 232 L110 226 L128 226 L128 244 L262 244 L262 212 L274 212 L274 194 L284 194 L284 212 L298 212 L298 230 L330 230 L330 218 L350 218 L350 234 L390 234 L390 260 Z'/><g stroke='#120826' fill='none' stroke-linecap='round'><path stroke-width='5' d='M34 260 C36 230 40 190 48 156'/><path stroke-width='4.5' d='M48 156 C34 148 18 152 6 162 M48 156 C60 144 80 144 92 152 M48 156 C42 140 30 132 18 132 M48 156 C62 156 76 166 82 178 M48 156 C36 162 26 174 24 188'/><path stroke-width='5' d='M352 260 C350 234 346 206 338 176'/><path stroke-width='4.5' d='M338 176 C326 166 310 168 300 178 M338 176 C350 162 368 162 380 170 M338 176 C332 160 320 152 308 152 M338 176 C352 178 362 188 368 200'/></g></svg>"), NIGHT=u("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 800' preserveAspectRatio='xMidYMid slice'><g stroke='#2fd6d0' stroke-opacity='.18'><path d='M0 500H800M0 520H800M0 550H800M0 590H800M0 640H800M0 700H800M0 770H800'/></g><g stroke='#ff4f8b' stroke-opacity='.16'><path d='M400 500V800M370 500L190 800M340 500L-20 800M430 500L610 800M460 500L820 800M310 500L-230 800M490 500L1030 800'/></g><g stroke='#ff9a3d' stroke-opacity='.18' fill='none' stroke-linecap='round'><path stroke-width='7' d='M640 500C640 420 634 340 620 250'/><path stroke-width='6' d='M620 250C600 236 572 240 556 258M620 250C640 228 672 228 692 242M620 250C610 222 590 210 570 212M620 250C646 254 662 274 668 296M620 250C602 262 588 284 586 306'/></g></svg>"), PALM=u("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' preserveAspectRatio='xMidYMid slice'><rect width='300' height='300' fill='#0f0828'/><circle cx='210' cy='90' r='54' fill='#ff4f8b' opacity='.18'/><g stroke='#ff4f8b' fill='none' stroke-linecap='round' stroke-width='6'><path d='M150 300 C152 240 160 170 176 110'/><path d='M176 110 C150 92 120 98 98 116 M176 110 C198 86 236 86 262 102 M176 110 C166 80 142 66 120 68 M176 110 C204 112 228 132 238 156 M176 110 C152 122 136 146 132 172'/></g><g stroke='#2fd6d0' fill='none' stroke-linecap='round' stroke-width='5' opacity='.85'><path d='M70 300 C70 262 74 226 82 196'/><path d='M82 196 C66 186 46 190 32 202 M82 196 C96 182 118 182 134 192 M82 196 C88 212 92 228 90 246'/></g></svg>");
  var st=document.createElement('style');
  st.textContent="@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');\n"+"/* \u0432\u0441\u0442\u0443\u043f\u043b\u0435\u043d\u0438\u0435: \u043a\u043e\u043c\u0438\u043a\u0441-\u043f\u0430\u043d\u0435\u043b\u0438, \u043b\u043e\u0433\u043e\u0442\u0438\u043f \u0438 \u043f\u043b\u0430\u0448\u043a\u0430 */\n#vintro{position:fixed;inset:0;z-index:99996;background:#140a2e;overflow:hidden;cursor:pointer;}\n@keyframes viOut{to{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%);visibility:hidden}}\n#vintro .pn{position:absolute;border:4px solid #0c0620;box-shadow:0 0 0 5px #fff,10px 10px 0 5px rgba(0,0,0,.35);background-size:cover;background-position:center;opacity:0}\n#vintro .p1{left:-4%;top:-3%;width:66%;height:46%;background-image:\"+SKY+\";transform:rotate(-4deg);animation:viP1 .5s cubic-bezier(.2,.9,.3,1.2) .05s forwards}\n#vintro .p2{right:-6%;top:22%;width:52%;height:44%;background-image:\"+PALM+\";transform:rotate(5deg);animation:viP2 .5s cubic-bezier(.2,.9,.3,1.2) .2s forwards}\n#vintro .p3{left:-6%;bottom:-4%;width:72%;height:40%;background:\"+NIGHT+\" center/cover,linear-gradient(180deg,#2b0f4f,#6b1d55);transform:rotate(3deg);animation:viP3 .5s cubic-bezier(.2,.9,.3,1.2) .35s forwards}\n@keyframes viP1{from{opacity:0;transform:translate(-60px,-40px) rotate(-12deg)}to{opacity:1;transform:rotate(-4deg)}}\n@keyframes viP2{from{opacity:0;transform:translate(80px,0) rotate(14deg)}to{opacity:1;transform:rotate(5deg)}}\n@keyframes viP3{from{opacity:0;transform:translate(-40px,70px) rotate(-6deg)}to{opacity:1;transform:rotate(3deg)}}\n#vintro .lg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:2}\n#vintro .lg b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:min(30vw,150px);line-height:.9;letter-spacing:2px;\n  background:linear-gradient(180deg,#ffe58a 0%,#ffb347 40%,#ff4f8b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;\n  -webkit-text-stroke:4px #140a2e;paint-order:stroke fill;filter:drop-shadow(7px 7px 0 #140a2e) drop-shadow(0 0 30px rgba(255,79,139,.6));\n  opacity:0;animation:viLogo .5s cubic-bezier(.2,1.4,.4,1) .6s forwards}\n@keyframes viLogo{from{opacity:0;transform:scale(2.6) rotate(-10deg)}to{opacity:1;transform:rotate(-4deg)}}\n#vintro .lg i{display:inline-block;margin-top:14px;font-style:normal;font-family:Anton,Impact,sans-serif;font-size:min(6vw,26px);letter-spacing:2px;color:#140a2e;background:#ffd36b;\n  padding:4px 14px;border-radius:6px;box-shadow:4px 4px 0 #0c0620;opacity:0;animation:viStamp .35s cubic-bezier(.2,1.6,.4,1) 1s forwards}\n@keyframes viStamp{from{opacity:0;transform:scale(1.8) rotate(8deg)}to{opacity:1;transform:rotate(3deg)}}\n#vintro .fl{position:absolute;inset:0;background:#fff;opacity:0;animation:viFlash .35s ease .6s;pointer-events:none;z-index:3}\n@keyframes viFlash{0%{opacity:.85}100%{opacity:0}}\n\n#vintro.go{animation:viOut .55s cubic-bezier(.7,0,.3,1) forwards}\nhtml.vintro #splash{visibility:hidden!important}\n";
  document.head.appendChild(st);
  var once=false; try{ once=!!sessionStorage.getItem('vice_intro'); sessionStorage.setItem('vice_intro','1'); }catch(e){}
  if(once||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){ return; }
  var o=document.createElement('div'); o.id='vintro';
  o.innerHTML='<div class="pn p1"></div><div class="pn p2"></div><div class="pn p3"></div><div class="fl"></div><div class="lg"><b>LUMO</b><i>VICE NIGHTS</i></div>';
  document.body.appendChild(o); document.documentElement.classList.add('vintro');
  var t0=Date.now(), gone=false;
  function go(){ if(gone) return; gone=true; o.classList.add('go'); setTimeout(function(){ o.remove(); document.documentElement.classList.remove('vintro'); },700); }
  o.onclick=go;
  // уходим, когда прошло вступление и Lumo уже загрузился (обычная заставка ушла)
  var iv=setInterval(function(){
    var sp=document.getElementById('splash'), app=document.getElementById('app');
    var ready=(!sp||sp.classList.contains('out'))&&app&&!app.classList.contains('hidden');
    var login=document.querySelector('#auth,#login,.auth');
    if(Date.now()-t0>2100&&(ready||login||Date.now()-t0>9000)){ clearInterval(iv); go(); }
  },100);
})();
</script>
<script>
/* Ссылка на профиль (lumomess.ru/#@имя) или приглашение (#+код): если установлено приложение Lumo — открываем его.
   Android: сразу открывается приложение, а если его нет — остаётся сайт.
   iPhone: без App Store система не даёт открыть приложение молча, поэтому показываем кнопку «Открыть в приложении». */
(function(){
  var h = location.hash || '';
  if (!/^#[@+][A-Za-z0-9_]{3,32}$/.test(h)) return;
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  if (standalone || /[?&]web=1/.test(location.search)) return;
  var key = 'lm_app_' + h, tried = false;
  try { tried = sessionStorage.getItem(key) === '1'; sessionStorage.setItem(key, '1'); } catch (e) {}
  var ua = navigator.userAgent || '';
  var app = 'lumo://open' + h;
  if (/Android/i.test(ua)) {
    if (tried) return;
    var back = location.origin + location.pathname + '?web=1' + h;
    location.replace('intent://open' + h + '#Intent;scheme=lumo;package=ru.volshebnymir.lumo;S.browser_fallback_url=' + encodeURIComponent(back) + ';end');
    return;
  }
  if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document)) {
    var show = function(){
      var who = h.charAt(1) === '@' ? 'профиль ' + h.slice(1) : 'приглашение';
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:2147483647;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:20px;background:rgba(26,28,54,.96);box-shadow:0 12px 40px rgba(0,0,0,.45);color:#eef0ff;font:15px -apple-system,system-ui;transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)';
      d.innerHTML = '<img src="apple-touch-icon.png" style="width:42px;height:42px;border-radius:11px"><div style="flex:1;min-width:0"><b style="display:block">Открыть в приложении Lumo</b><span style="opacity:.7;font-size:13px">' + who + '</span></div>' +
        '<a href="' + app + '" style="padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#22c1ff);color:#fff;font-weight:700;text-decoration:none">Открыть</a>' +
        '<button aria-label="Закрыть" style="border:0;background:none;color:#8d90b8;font-size:22px;padding:4px 6px">&times;</button>';
      d.querySelector('button').onclick = function(){ d.style.transform = 'translateY(140%)'; setTimeout(function(){ d.remove(); }, 450); };
      document.body.appendChild(d);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ d.style.transform = 'none'; }); });
    };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  }
})();
</script>
<script>
/* возврат после оплаты ЮMoney: окошко оплаты сообщает Lumo и закрывается само */
(function(){ if(!/[?&]lumo_paid\b/.test(location.search)) return; try{ if(window.opener&&window.opener!==window){ window.opener.postMessage({lumo_paid:1},'*'); window.close(); } }catch(e){} })();
</script>
<script>window.LUMO_PWA = { sw: 'lumo-sw.js' };</script>
<script>
/* Регистрируем service worker сразу: он кэширует оболочку сайта и код мессенджера,
   чтобы при следующем открытии без интернета чаты и переписка всё равно показывались */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register(window.LUMO_PWA.sw).catch(function(){});
}
</script>
<script>
/* Код Lumo грузим с российского посредника, а если он недоступен — напрямую (и наоборот: запоминаем, что сработало) */
(function(){
  var P='https://api.lumomess.ru/functions/v1/lumo', D='https://foniukmpiukuwpcdvdhp.supabase.co/functions/v1/lumo';
  var last=null; try{ last=localStorage.getItem('lm_ld'); }catch(e){}
  var list = last==='d' ? [[D,'d'],[P,'p']] : [[P,'p'],[D,'d']];
  var done=false;
  function fail(){
    if(done) return;
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0c0d1a;color:#eef0ff;font:16px system-ui;text-align:center;padding:24px';
    d.innerHTML='<div>Не удаётся загрузить Lumo.<br>Проверьте интернет и попробуйте ещё раз.</div><button style="padding:12px 22px;border:0;border-radius:14px;background:#7c5cff;color:#fff;font:600 16px system-ui">Повторить</button>';
    d.querySelector('button').onclick=function(){ location.reload(); };
    document.body.appendChild(d);
  }
  function load(i){
    if(done) return;
    if(i>=list.length) return fail();
    var s=document.createElement('script'), t;
    var next=function(){ clearTimeout(t); s.onload=s.onerror=null; load(i+1); };
    s.onload=function(){ done=true; clearTimeout(t); try{ localStorage.setItem('lm_ld',list[i][1]); }catch(e){} };
    s.onerror=next;
    t=setTimeout(next, i===0?7000:20000);
    s.src=list[i][0]+'?t='+Math.floor(Date.now()/60000);
    document.body.appendChild(s);
  }
  load(0);
})();
</script>
